 if(ok&&q<.04+D*.02)G[8][x]=2;
 else if(ok&&q<.08+D*.03&&x%4==0)EN.push({t:L>1&&r()<.4?'p':'s',x:x*T,y:8*T+6,w:26,h:26,d:r()<.5?-1:1});
