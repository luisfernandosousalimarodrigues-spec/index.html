<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BetBoy Run</title>
<style>
:root{--bg:#0c0d10;--ouro:#c9a24b;--m:#ece7da;--mu:#8d93a1;--ln:#2a2e38;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(900px 500px at 50% -150px,#2e2110,transparent 70%),var(--bg);color:var(--m);font-family:system-ui,sans-serif;display:flex;justify-content:center;padding:10px;touch-action:manipulation;user-select:none}
#app{width:min(1180px,100%);display:flex;flex-direction:column;gap:10px;justify-content:center}
header{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:10px;font:600 1.1rem Georgia,serif;letter-spacing:.2em;color:var(--ouro)}.brand b{font-weight:600;color:var(--m)}
.lg{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#f6dc92,#c9a24b 55%,#7a5a1e);color:#14110a;letter-spacing:0;box-shadow:0 0 14px #c9a24b88}
.tools{display:flex;gap:8px}.tools button{background:#14161b;border:1px solid var(--ln);border-radius:8px;padding:6px 12px;font-size:.75rem;color:var(--mu)}.tools button:hover{border-color:var(--ouro);color:var(--ouro)}
#game{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:16px;align-items:start}
#wrap{position:relative;outline:0;border-radius:12px;box-shadow:0 20px 60px #000c,0 0 0 1px #6b5527}
#c{width:100%;display:block;image-rendering:pixelated;border-radius:12px;background:#10131a}
#pb{position:absolute;top:8px;right:8px;z-index:3;width:34px;height:34px;border-radius:8px;border:1px solid #6b5527;background:#0c0d10aa;font-weight:700}
#ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:radial-gradient(ellipse at 50% 40%,#0c0d1099,#0c0d10ee);border-radius:12px;text-align:center;padding:14px;overflow:auto}
h1,h2,h3{margin:0}p{margin:0;color:#b9c0cf;font-size:.88rem;line-height:1.5}
h2{font:600 1.3rem Georgia,serif;letter-spacing:.15em;color:var(--ouro)}h2.lose{color:#ef6b73}
.logo small{display:block;letter-spacing:.55em;color:var(--m);font:600 1rem Georgia,serif}
.logo h1{font:700 4.2rem Georgia,serif;letter-spacing:.14em;color:var(--ouro);text-shadow:0 0 30px #c9a24b88,0 4px 0 #6b5527;animation:flut 2.4s ease-in-out infinite}
@keyframes flut{50%{transform:translateY(-6px)}}
.tag{color:var(--m);letter-spacing:.06em}.rec{color:var(--ouro)}.mini{font-size:.7rem;color:var(--mu)}
button{font:inherit;cursor:pointer;color:inherit}
.btns{display:flex;flex-direction:column;gap:10px;width:min(280px,100%)}.btns.row{flex-direction:row;width:auto}
.btn{padding:12px 22px;border-radius:10px;border:1px solid #6b5527;background:linear-gradient(180deg,#232733,#171a22);font-weight:700;letter-spacing:.12em;transition:transform .15s,box-shadow .2s,border-color .2s}
.btn:hover{border-color:var(--ouro);transform:translateY(-2px);box-shadow:0 8px 20px #0008}.btn:active{transform:translateY(1px)}
.btn.big{background:linear-gradient(180deg,#ecca78,#c9a24b 55%,#a07f31);color:#14110a;border:0;box-shadow:0 4px 0 #6b5527,0 10px 24px #c9a24b30}
.csel{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center}
.pv canvas{width:128px;height:128px;image-rendering:pixelated;background:radial-gradient(circle,#2a2418,#101216);border:2px solid #6b5527;border-radius:14px;display:block}
.pv b{display:block;font:600 1.4rem Georgia,serif;color:var(--ouro);margin-top:6px}.pv em{font-style:normal;color:var(--mu);font-size:.8rem}
.info{max-width:300px;text-align:left}
.bar{display:flex;align-items:center;gap:8px;font-size:.78rem;margin:5px 0}.bar span{width:78px;color:var(--mu)}.bar i{flex:1;height:8px;background:#1b1e25;border-radius:4px;overflow:hidden}.bar u{display:block;height:100%;background:linear-gradient(90deg,#3fae80,#c9a24b)}
.pw{margin-top:8px;font-size:.82rem;line-height:1.5}.pw small{display:block;color:var(--ouro);letter-spacing:.1em;text-transform:uppercase;font-size:.65rem;margin-top:6px}
#chs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(420px,100%)}
#chs button{background:#14161b;border:1px solid var(--ln);border-radius:10px;padding:6px 4px;font-size:.75rem;color:var(--mu);transition:transform .15s}
#chs button:hover{transform:translateY(-3px)}#chs button.on{border-color:var(--ouro);color:var(--ouro);box-shadow:0 0 12px #c9a24b55}
#chs canvas{width:44px;height:44px;display:block;margin:0 auto 2px;image-rendering:pixelated}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left;max-width:660px}
.grid2>div{background:#14161b;border:1px solid var(--ln);border-radius:10px;padding:10px 14px}
.grid2 h3{color:var(--ouro);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
#hud{display:flex;flex-direction:column;gap:12px}
.card{display:flex;gap:10px;align-items:center;background:#14161b;border:1px solid var(--ln);border-radius:12px;padding:10px}
#av{width:64px;height:64px;image-rendering:pixelated;flex:none;background:radial-gradient(circle,#2a2418,#101216);border-radius:10px}
.card b{display:block;font:600 1.1rem Georgia,serif;color:var(--ouro)}.card small{color:var(--mu);font-size:.72rem}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:#14161b;border:1px solid var(--ln);border-radius:10px;padding:8px 10px}
.stats small{display:block;color:var(--mu);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase}.stats b{color:var(--ouro);font-size:1.1rem}.stats .wide{grid-column:1/-1}
.keys{font-size:.75rem;color:var(--mu);line-height:1.9;background:#14161b;border:1px solid var(--ln);border-radius:10px;padding:10px 12px}
kbd{background:#232733;border:1px solid #3a3f4c;border-radius:4px;padding:1px 6px;color:var(--m);font-size:.7rem}
#pad{display:none;justify-content:space-between}#pad div{display:flex;gap:10px}
#pad button{width:76px;height:64px;border-radius:14px;border:1px solid #3a3220;background:#171a21;font-size:1.4rem}
@media(pointer:coarse){#pad{display:flex}}
@media(max-width:899px){#game{grid-template-columns:1fr}#hud{flex-direction:row;flex-wrap:wrap}.keys,.card small{display:none}.card{padding:6px 10px}#av{width:40px;height:40px}.stats{grid-template-columns:repeat(4,auto);flex:1}.stats .wide{grid-column:auto}
 #ov{position:fixed;border-radius:0}.logo h1{font-size:3.2rem}.grid2{grid-template-columns:1fr}.tools button{padding:5px 8px}}
</style></head><body>
<div id="app">
<header><div class="brand"><span class="lg">♠</span><span>BETBOY <b>RUN</b></span></div><div class="tools"><button id="mu">Som: ligado</button><button id="fs">Tela cheia</button></div></header>
<div id="game">
<div id="wrap" tabindex="0"><canvas id="c" width="640" height="352"></canvas><button id="pb" title="Pausar">II</button><div id="ov"></div></div>
<aside id="hud"><div class="card"><canvas id="av" width="64" height="64"></canvas><div><b id="hn"></b><small id="ha"></small></div></div>
<div class="stats"><div><small>Vidas</small><b id="hl"></b></div><div><small>Moedas</small><b id="hc"></b></div><div><small>Fase</small><b id="hf"></b></div><div><small>Pontos</small><b id="hp"></b></div><div class="wide"><small>Recorde</small><b id="hb"></b></div></div>
<div class="keys"><kbd>←</kbd> <kbd>→</kbd> andar · <kbd>Espaço</kbd> pular<br><kbd>X</kbd> poder · <kbd>P</kbd> pausar</div></aside>
</div>
<div id="pad"><div><button data-k="l">◀</button><button data-k="r">▶</button></div><div><button data-k="p">✦</button><button data-k="j">▲</button></div></div>
</div>
<script>
const $=i=>document.getElementById(i),X=$('c').getContext('2d'),T=32,H=11,rnd=n=>Math.floor(Math.random()*n);
const BASE=[[5,1,6,1,'#a82f36'],[4,2,8,2,'#a82f36'],[3,4,10,1,'#c9a24b'],[4,5,8,5,'#e8b98a'],[3,6,1,2,'#e8b98a'],[12,6,1,2,'#e8b98a'],[4,6,3,2,'#0c0d10'],[9,6,3,2,'#0c0d10'],[7,6,2,1,'#0c0d10'],[5,6,1,1,'#5b6170'],[10,6,1,1,'#5b6170'],[7,10,2,1,'#e8b98a'],[3,11,10,4,'#1b1e25'],[6,11,4,4,'#ece7da'],[7,11,2,3,'#a82f36'],[3,11,1,4,'#c9a24b'],[13,11,3,3,'#c9a24b'],[14,12,1,1,'#14110a'],[6,9,4,1,'#7a2d2d'],[5,8,1,1,'#7a2d2d'],[10,8,1,1,'#7a2d2d']];
const PAL=[{},{'#a82f36':'#2f5d9e','#c9a24b':'#9aa3b2','#e8b98a':'#d9a678','#1b1e25':'#2a2237','#ece7da':'#8d93a1'},{'#a82f36':'#2f8a57','#c9a24b':'#9aa3b2','#e8b98a':'#d9a678','#1b1e25':'#1f3a2b','#ece7da':'#8d93a1'},{'#a82f36':'#d4a72c','#c9a24b':'#e8e0c8','#e8b98a':'#e8c79a','#1b1e25':'#4a3f1c','#ece7da':'#c9b36a'},{'#a82f36':'#7a3fa0','#c9a24b':'#e8c46a','#e8b98a':'#e8c79a','#1b1e25':'#2b1a3a','#ece7da':'#f0d9ff'},{'#a82f36':'#1f8a8a','#c9a24b':'#9aa3b2','#e8b98a':'#c68b5a','#1b1e25':'#16303a','#ece7da':'#8fd0d0'},{'#a82f36':'#d9722b','#c9a24b':'#f0c36a','#e8b98a':'#f0c9a0','#1b1e25':'#4a2a14','#ece7da':'#ffe0b8'}];
const CHS=[{n:'Rouge',pal:0,f:'#3a1a14',bow:'#f4c2d0',ab:'Pulo duplo',pw:'Bola de fogo',cd:35,s:[3,4,3],d:'Elegante e ágil. Dá um segundo pulo no ar e lança bolas de fogo.',pd:'dispara uma bola de fogo que derrota inimigos e fere chefões'},{n:'Remy',pal:1,ab:'Mais veloz',sp:1.2,pw:'Investida',cd:80,s:[5,3,3],d:'O mais veloz do grupo. Avança em disparada e atropela inimigos.',pd:'avança invencível e derrota o que tocar'},{n:'Ray',pal:3,ab:'Super pulo',jp:1.15,pw:'Pisão',cd:90,s:[3,5,3],d:'Pula mais alto que todos e cai com muita força.',pd:'mergulho no ar com onda de choque que derrota inimigos'},{n:'Forest',pal:2,f:'#5a3a1e',bow:'#e8e0c8',ab:'4 vidas',hp:1,pw:'Escudo',cd:480,s:[3,3,4],d:'Resistente e protetora. Começa a jornada com uma vida extra.',pd:'bolha que protege de qualquer dano por 3 segundos'}];
const NPCS=[{n:'Lia',pal:4,f:'#2a1a3a',bow:'#ffd1dc',t:['Pise nos monstros','para derrotá-los!']},{n:'Dom',pal:5,t:['Espinhoso não pode','ser pisado. Pule!']},{n:'Nina',pal:6,f:'#4a2a14',bow:'#fff',t:['O chefão cai com','3 pisadas. Boa sorte!']}];
const LV=[{n:'Rua das Fichas',sky:['#1d1733','#0e1018'],b:'Crupiê Zé',bc:'#5a1f2a'},{n:'Cassino Neon',sky:['#14263d','#0b1018'],b:'Barão Dado',bc:'#1f3a5a'},{n:'Cobertura do Chefão',sky:['#2e1424','#10080e'],b:'Rainha Ás',bc:'#3a1f5a'}];
function spr(C,px,py,s,pal,fl,c){const rc=(rx,ry,w,h,col)=>{C.fillStyle=col;C.fillRect(Math.round(px+(fl?16-rx-w:rx)*s),Math.round(py+ry*s),w*s,h*s)};
BASE.forEach(([rx,ry,w,h,col])=>rc(rx,ry,w,h,pal[col]||col));if(c&&c.f){rc(3,4,1,7,c.f);rc(12,4,1,7,c.f);rc(11,2,2,2,c.bow)}}
let S='menu',lv=1,lives=3,coins=0,score=0,G,W,AR,CO,EN,IT,B,CK,NP,p,cam=0,inv=0,keys={},best=0,last=0,t=0,ch=0,ac=null,rx=40,PT=[],FT=[],shk=0,ttl=0,ban=0,bmsg='',FB=[];
let mute=0,scr='home',cmode='play',lastCh=-1;
try{best=+localStorage.getItem('bbrun')||0}catch(e){}
function beep(f,d){if(mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='square';g.gain.value=.04;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function rng(s){return()=>(s=(s*16807)%2147483647)/2147483647}
const burst=(x,y,c,n)=>{for(let i=0;i<n;i++)PT.push({x,y,vx:(Math.random()-.5)*6,vy:-Math.random()*5-1,l:30+rnd(20),c})},ft=(x,y,s)=>FT.push({x,y,s,l:50});
function load(L){const r=rng(L*977+13);W=70+L*22;AR=W-20;G=[...Array(H)].map(()=>Array(W).fill(0));CO=[];EN=[];IT=[];PT=[];FT=[];FB=[];const gp=Array(W+3).fill(0);
for(let x=9;x<AR-4;){if(r()<.13+L*.03){const w=2+Math.floor(r()*(1+L));for(let i=0;i<w;i++)gp[x+i]=1;x+=w+4}else x++}
for(let x=0;x<W;x++)if(!gp[x]){G[9][x]=1;G[10][x]=1}
for(let x=11;x<AR-3;x++){const ok=!gp[x-1]&&!gp[x]&&!gp[x+1],q=r();
 if(ok&&q<.04+L*.02)G[8][x]=2;
 else if(ok&&q<.08+L*.03&&x%4==0)EN.push({t:L>1&&r()<.4?'p':'s',x:x*T,y:8*T+6,w:26,h:26,d:r()<.5?-1:1});
 else if(q>.93)for(let i=0;i<3;i++)if(!gp[x+i])CO.push({x:(x+i)*T+16,y:8*T+8});
 if(L>1&&x%13==0&&r()<.7){const y0=110+r()*60;EN.push({t:'b',x:x*T,x0:x*T,y:y0,y0,w:28,h:20,d:1,ph:r()*6})}}
for(let x=7;x<AR-4;x+=4+Math.floor(r()*5)){if(r()<.55){const row=6+Math.floor(r()*2),n=3+Math.floor(r()*3);for(let i=0;i<n;i++){G[row][x+i]=1;CO.push({x:(x+i)*T+16,y:(row-1)*T+10})}
 const q=r(),ik=q<.12?'h':q<.2?'s':q<.3?'m':q<.4?'v':0;if(ik)IT.push({k:ik,x:(x+1)*T+16,y:(row-1)*T+8})}}
for(let x=0;x<8;x++)G[8][x]=0;
let cx=AR>>1;while(gp[cx]||G[8][cx]===2)cx++;CK={x:cx*T,on:0};rx=40;
B={x:(AR+6)*T,y:9*T-56,w:56,h:56,hp:3,d:-1,vy:0,on:1,fl:0,t:0,dead:0};NP={x:5*T,...NPCS[L-1]};
p={x:40,y:150,w:22,h:30,vx:0,vy:0,on:0,coy:0,buf:0,fl:0,jh:0,dj:1,star:0,cd:0,dash:0,shield:0,slam:0,ph:0,mag:0,spd:0};cam=0;inv=60;ttl=170;ban=0;shk=0}
const sol=(x,y)=>{const c=x>>5,r=y>>5;return r>=0&&r<H&&c>=0&&c<W&&G[r][c]===1};
const hit=(a,b)=>a.x+a.w>b.x&&a.x<b.x+b.w&&a.y+a.h>b.y&&a.y<b.y+b.h;
function respawn(){p.dash=0;p.slam=0;p.x=rx;p.y=150;p.vx=p.vy=0;inv=100;cam=Math.max(0,p.x-200)}
function hurt(){if(inv>0||p.star>0||p.dash>0||p.shield>0||p.slam)return;lives--;beep(120,.25);shk=10;burst(p.x+11,p.y+15,'#ef6b73',10);if(lives<=0)over();else respawn()}
function fall(){lives--;beep(120,.25);if(lives<=0)over();else respawn()}
function fin(h){best=Math.max(best,score);try{localStorage.setItem('bbrun',best)}catch(e){}ov(h)}
function over(){S='over';fin(`<h2 class="lose">FIM DE JOGO</h2><p>Você fez ${score} pontos e juntou ${coins} moedas.</p>${ENDB}`)}
function ov(h){const o=$('ov');o.innerHTML=h;o.style.display='flex';bind()}
function start(){lv=1;lives=CHS[ch].hp?4:3;coins=0;score=0;load(1);S='play';scr='';$('ov').style.display='none';last=performance.now();beep(660,.1)}
function kill(e,s){e.dead=1;score+=s;ft(e.x-cam,e.y,'+'+s);burst(e.x+e.w/2,e.y+e.h/2,'#e8c46a',10);beep(300,.1)}
function bhit(){B.hp--;B.fl=70;score+=200;shk=14;beep(200,.2);burst(B.x+28,B.y,'#ef6b73',14);ft(B.x-cam,B.y,'+200');if(B.hp<=0){B.dead=1;score+=500;burst(B.x+28,B.y+28,'#e8c46a',40);ft(B.x-cam,B.y-10,'+500');beep(1200,.4)}}
function slam(){p.slam=0;shk=16;beep(140,.25);for(let i=-6;i<=6;i++)burst(p.x+11+i*14,p.y+30,'#e8c46a',1);EN.forEach(e=>{if(!e.dead&&Math.abs(e.x+e.w/2-(p.x+11))<110&&Math.abs(e.y-p.y)<80)kill(e,60)});if(!B.dead&&B.fl<=0&&B.on&&Math.abs(B.x+28-(p.x+11))<100)bhit()}
function power(){const n=CHS[ch].n;if(p.cd>0)return;
if(n==='Rouge'){FB.push({x:p.x+(p.fl?-6:28),y:p.y+14,vx:(p.fl?-1:1)*7.5,l:80});p.cd=35;beep(600,.08)}
else if(n==='Remy'){p.dash=14;p.vx=(p.fl?-1:1)*9;p.cd=80;beep(400,.12);burst(p.x+11,p.y+15,'#8fb4ff',8)}
else if(n==='Ray'){if(p.on){ft(p.x-cam,p.y,'Use no ar!');return}p.slam=1;p.vy=14;p.cd=90;beep(250,.1)}
else{p.shield=180;p.cd=480;beep(900,.15)}}
function upd(dt){t+=dt;const C=CHS[ch],ax=((keys.r||keys.d)?1:0)-((keys.l||keys.a)?1:0);if(p.dash>0){p.dash-=dt;p.vy=0}else{p.vx+=(ax*3.4*(C.sp||1)*(p.spd>0?1.35:1)-p.vx)*.25*dt;if(ax)p.fl=ax<0}
if(keys.j&&!p.jh){p.buf=8;p.jh=1}if(!keys.j){p.jh=0;if(p.vy<-3.5)p.vy*=.7}
p.buf-=dt;p.coy=p.on?7:p.coy-dt;if(p.on)p.dj=1;
if(p.buf>0){if(p.coy>0){p.vy=-11.8*(C.jp||1);p.buf=0;p.coy=0;beep(520,.08)}else if(C.n==='Rouge'&&p.dj>0){p.vy=-10.5;p.dj=0;p.buf=0;beep(700,.08);burst(p.x+11,p.y+30,'#fff',6)}}
if(keys.p&&!p.ph){p.ph=1;power()}if(!keys.p)p.ph=0;
if(p.dash<=0&&!p.slam)p.vy=Math.min(14,p.vy+.6*dt);
p.x=Math.max(0,p.x+p.vx*dt);const tp=p.y+2,bt=p.y+p.h-2;
if(p.vx>0&&(sol(p.x+p.w,tp)||sol(p.x+p.w,bt))){p.x=((p.x+p.w)>>5<<5)-p.w-.01;p.vx=0}else if(p.vx<0&&(sol(p.x,tp)||sol(p.x,bt))){p.x=((p.x>>5)+1)<<5;p.vx=0}
p.y+=p.vy*dt;p.on=0;const l=p.x+2,r=p.x+p.w-2;
if(p.vy>0&&(sol(l,p.y+p.h)||sol(r,p.y+p.h))){p.y=((p.y+p.h)>>5<<5)-p.h;p.vy=0;p.on=1}else if(p.vy<0&&(sol(l,p.y)||sol(r,p.y))){p.y=((p.y>>5)+1)<<5;p.vy=0}
if(p.slam&&p.on)slam();
if(p.y>H*T+40){fall();return}
